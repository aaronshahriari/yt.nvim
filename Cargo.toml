[package]
name = "yt"
version = "0.1.0"
edition = "2021"
description = "YouTube search/thumbnail helper for yt.nvim"

[[bin]]
name = "yt"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
